config_version	1.2

############################
# Directories and commands
############################

# NFS-mounted backup root from Whitey, as seen on Lumpy
snapshot_root	/mnt/backup/.snapshots/.sync/lumpy_media/
no_create_root	1

cmd_cp	/bin/cp
cmd_rm	/bin/rm
cmd_rsync	/usr/bin/rsync
cmd_ssh	/usr/bin/ssh
cmd_logger	/usr/bin/logger
cmd_du	/usr/bin/du
cmd_rsnapshot_diff	/usr/bin/rsnapshot-diff

############################
# Backup intervals
############################

retain	daily	7
retain	weekly	4

############################
# Logging / locking
############################

verbose	2
loglevel	3
logfile	/var/log/rsnapshot-lumpy.log
lockfile	/var/run/rsnapshot-lumpy.pid

############################
# Rsync options
############################

# Local rsync (no SSH needed since /data is local and snapshot_root is NFS)[web:7][web:16]
rsync_short_args	-a
rsync_long_args	--delete --numeric-ids --delete-excluded --bwlimit=20480

############################
# Backup points
############################

# Snapshot local /data into the NFS-backed snapshot_root
backup	/data/	lumpy_data/
backup	/opt/beets/	lumpy_opt_beets/
backup	/srv/docker/	lumpy_srv_docker/

#########################
# Excludes
#########################
exclude_file	/etc/rsnapshot-lumpy.excludes

cmd_preexec	/usr/local/sbin/plex-db-dump

